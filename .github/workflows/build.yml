name: Build ExtremeKernel-N 9820/9825

on:
  workflow_dispatch:
    inputs:      
      tag:
        description: 'Release Tag'
        required: true        

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      
    strategy:
      fail-fast: false
      matrix:
        target: [beyond0lte, beyond1lte, beyond2lte, beyondx, d1, d1xks, d2s, d2x]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          echo "::group:: Cleaning up pre-installed software to free space"
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          echo "::endgroup::"

      - name: Set up build environment
        run: |
          echo "::group:: Installing dependencies and tools"
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "::endgroup::"

      - name: Set up CCache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-

      - name: Build kernel (${{ matrix.target }})
        env:
          USE_CCACHE: 1
          CCACHE_DIR: ~/.cache/ccache
        run: |
          chmod +x build.sh
          ./build.sh -m ${{ matrix.target }} -k y -r n

      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKernel-${{ matrix.target }}-${{ github.event.inputs.tag }}
          path: build/out/${{ matrix.target }}/*.zip
          compression-level: 6

  release:
    needs: build 
    runs-on: ubuntu-24.04
    permissions:
      contents: write 
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw_artifacts

      - name: Flatten artifacts directory structure
        run: |
          mkdir -p final_artifacts
          find raw_artifacts/ -name "*.zip" -exec cp {} final_artifacts/ \;

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag }}
          name: "ExtremeKernel-N 9820/9825 - ${{ github.event.inputs.tag }}"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }} 
          artifacts: "final_artifacts/*.zip"
          body: |
            # Official Release for ExtremeKernel-N 9820/9825
            
            Automated build generated by GitHub Actions.
            
            - **Commit SHA:** `${{ github.sha }}`
            - **Tag:** `${{ github.event.inputs.tag }}`
            
            | Device Family | Device Name | Codename | File Name |
            | :--- | :--- | :--- | :--- |
            | **Galaxy S10 Series** 
            | Galaxy S10e | `beyond0lte` | `ExtremeKernel-beyond0lte-*.zip` |
            | | Galaxy S10 | `beyond1lte` | `ExtremeKernel-beyond1lte-*.zip` |
            | | Galaxy S10+ | `beyond2lte` | `ExtremeKernel-beyond2lte-*.zip` |
            | | Galaxy S10 5G | `beyondx` | `ExtremeKernel-beyondx-*.zip` |
            | **Galaxy Note 10 Series** 
            | Galaxy Note 10 | `d1` | `ExtremeKernel-d1-*.zip` |
            | | Galaxy Note 10 5G | `d1xks` | `ExtremeKernel-d1xks-*.zip` |
            | | Galaxy Note 10+ | `d2s` | `ExtremeKernel-d2s-*.zip` |
            | | Galaxy Note 10+ 5G | `d2x` | `ExtremeKernel-d2x-*.zip` |
            
            _Note:Ensure you are on the correct firmware base before flashing._
